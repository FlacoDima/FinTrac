<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fintrac</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" href="/assets/imgs/graph-up-arrow.svg" type="image/x-icon">
</head>
<body>
    <!-- Contenedor para la autenticación -->
    <div class="auth-container">
        <!-- Formulario login -->
        <div id="loginForm" class="auth-form active">
            <h2 class="fw-bold">Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label class="fw-bold" for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="Ingrese su correo registrado">
                    <span class="error-message" id="login-email-error"></span>
                </div>
                <div class="form-group">
                    <label class="fw-bold" for="login-password">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="login-password" required placeholder="Ingrese su contraseña segura">
                        <i class="fas fa-eye-slash toggle-password" data-target="login-password"></i>
                    </div>
                    <span class="error-message" id="login-password-error"></span>
                </div>
                <button type="submit" class="auth-btn">Iniciar Sesión</button>
                <p class="auth-switch fw-bold">¿No tienes cuenta? <a id="RegisterLink" href="#">Regístrate aquí</a></p>
            </form>
        </div>

        <!-- Formulario registro -->
        <div id="registerForm" class="auth-form">
            <h2 class="fw-bold">Crear Cuenta</h2>
            <form id="register-form">
                <div class="form-group">
                    <label class="fw-bold" for="register-name">Nombre Completo</label>
                    <input type="text" id="register-name" required placeholder="Nombre">
                    <span class="error-message" id="register-name-error"></span>
                </div>
                <div class="form-group">
                    <label class="fw-bold" for="register-email">Correo Electrónico</label>
                    <input type="email" id="register-email" required placeholder="ejemplo123@email.com">
                    <span class="error-message" id="register-email-error"></span>
                </div>
                <div class="form-group">
                    <label class="fw-bold" for="register-password">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="register-password" required placeholder="Crea una contraseña segura">
                        <i class="fas fa-eye-slash toggle-password" data-target="register-password"></i>
                    </div>
                    <span class="error-message" id="register-password-error"></span>
                </div>
                <div class="form-group">
                    <label class="fw-bold" for="register-confirm-password">Confirmar Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="register-confirm-password" required placeholder="Repite tu contraseña">
                        <i class="fas fa-eye-slash toggle-password" data-target="register-confirm-password"></i>
                    </div>
                    <span class="error-message" id="register-confirm-password-error"></span>
                </div>
                <button type="submit" class="auth-btn">Crear Cuenta</button>
                <p class="auth-switch fw-bold">¿Ya tienes cuenta? <a id="LoginLink" href="#">Inicia sesión aquí</a></p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
